[project]
name = "extractor-proxy"
# Read from the package rather than duplicated here: __version__ is served by /healthz
# and in the OpenAPI document, so a drift between the two would be externally visible.
dynamic = ["version"]
description = "OpenAI-compatible proxy that turns any chat model into a structured data extractor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.32",
    # httpx2 rather than httpx: Starlette 1.x uses it for TestClient, and it ships
    # MockTransport, so the upstream client and the tests share one HTTP library.
    "httpx2>=2.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/extractor_proxy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
